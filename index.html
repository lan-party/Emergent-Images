<html>
    <head>
        <title>Evolutionary Image Gen</title>
        <style>
            .canvas {
                display: inline-block;
                max-width: 200;
                margin: 2px;
                border-style: solid;
                border-color: black;
            }
            .canvas:hover {
                cursor: pointer;
                border-color: blue;
            }
            .canvas-large {
                display: inline-block;
                max-width: 500;
                border-style: solid;
                border-color: black;
            }
            .center-content-div {
                display: flex;
                justify-content: center;
                align-items: center;
                margin-bottom: 15px;
            }
        </style>
    </head>
    <body >
        <div class="center-content-div">
            <span id="canvas" class="canvas-large"></span>
        </div>
        
        <div class="center-content-div">
            <p>Select a mutated image from the grid below to generate new mutations from it.</p>
        </div>
        
        <div class="center-content-div">
            <button onclick="newBase()">New Base</button>
            <button onclick="populateMutationOptions()" style="margin-left: 20px;">Refresh Mutations</button>
        </div>

        <div class="" id="mutations">

        </div>
        

        <script>
            function randomEllipse(){
                return `${Math.floor(Math.random() * 999)},
                        ${Math.floor(Math.random() * 999)},
                        ${Math.floor(Math.random() * 500)},
                        ${Math.floor(Math.random() * 500)},
                        ${Math.floor(Math.random() * 255)},
                        ${Math.random()},
                        ${Math.floor(Math.random() * 360)}`;
            }
            function mutateValue(originalVal, changeMin, changeMax, floorVal, ceilVal, integer=true){
                const updateVal = Number(integer ? 
                                    Math.floor(Math.random() * (changeMax - changeMin + 1)) + changeMin : 
                                    Math.random() * (changeMax - changeMin) + changeMin);
                
                console.log(Number(originalVal) + updateVal);
                if(Number(originalVal) + updateVal > ceilVal){
                    return ceilVal;
                }else if(Number(originalVal) + updateVal < floorVal){
                    return floorVal;
                }else{
                    return Number(originalVal) + updateVal;
                }
            }
            function mutateSvg(svgString){
                let newSvgString = '';

                // Mutate background color
                // const fill = mutateValue(Number(svgString.split(";")[0]), -50, 50, 0, 255);
                const fill = mutateValue(Number(svgString.split(";")[0]), -10, 10, 0, 255);
                newSvgString += `${fill};`;

                // Loop through ellipses
                const ellipses = [];
                for(const ellipse of svgString.split(";")[1].split(":")){
                    let ellipseData = ellipse.split(",");

                    // cx
                    ellipseData[0] = mutateValue(ellipseData[0], -10, 10, 0, 999);

                    // cy
                    ellipseData[1] = mutateValue(ellipseData[1], -10, 10, 0, 999);

                    // rx
                    ellipseData[2] = mutateValue(ellipseData[2], -5, 5, 0, 500);

                    // ry
                    ellipseData[3] = mutateValue(ellipseData[3], -5, 5, 0, 500);

                    // fill
                    ellipseData[4] = mutateValue(ellipseData[4], -10, 10, 0, 255);

                    // opacity
                    ellipseData[5] = mutateValue(ellipseData[5], -.05, .05, 0, 1, false);

                    // rotation
                    ellipseData[4] = mutateValue(ellipseData[6], -90, 90, 0, 360);

                    ellipses.push(ellipseData.join(","));
                }

                if(ellipses.length > 3){
                    // Drop a random number of randomly selected ellipses
                    const randomDropCount = Math.floor(Math.random() * 3);
                    for(let a=0; a < randomDropCount; a++){
                        const randomIndex = Math.floor(Math.random() * (ellipses.length-1));
                        ellipses.splice(randomIndex, 1);
                    }
                }
                

                // Add a random number of new ellipses
                const randomAddCount = Math.floor(Math.random() * 3);
                for(let a=0; a < randomAddCount; a++){
                    const randomIndex = Math.floor(Math.random() * (ellipses.length-1));
                    ellipses.splice(randomIndex, 0, randomEllipse());
                }

                // Move a random number of randomly selected ellipses to the front of the array
                const randomShuffleCount = Math.floor(Math.random() * Math.floor(ellipses.length/5));
                for(let a=0; a < randomShuffleCount; a++){
                    const randomIndex = Math.floor(Math.random() * (ellipses.length-1));
                    ellipses.unshift(ellipses.splice(randomIndex, 1)[0]);
                }

                newSvgString += ellipses.join(":");
                return newSvgString;
            }
            function dataToSvgContent(svgString){
                let svgContent = `<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width: 100%; height: auto; display: block;">`;

                if(svgString.includes(";")){
                    const splitString = svgString.split(";");
                    svgString = splitString[1];
                    svgContent += `<rect width="100%" height="100%" fill="rgb(${splitString[0]} ${splitString[0]} ${splitString[0]})" />`;
                }

                for(const listItem of svgString.split(":")){
                    const splitString = listItem.split(",");
                    svgContent += `<ellipse 
                                    cx="${splitString[0]}" 
                                    cy="${splitString[1]}" 
                                    rx="${splitString[2]}" 
                                    ry="${splitString[3]}" stroke-width="2" 
                                    fill="rgb(${splitString[4]} ${splitString[4]} ${splitString[4]})" 
                                    opacity="${splitString[5]}" 
                                    transform="rotate(${splitString[6]} ${splitString[0]} ${splitString[1]})" />`
                }

                svgContent += `</svg>`;

                return svgContent;
            }
            function populateMutationOptions(optionCount=25){
                
                document.getElementById("mutations").innerHTML = "";
                
                for(let a=0; a < optionCount; a+=5){
                    
                    var row = document.createElement('div');
                    row.classList.add("center-content-div");
                    for(let b=a; b < a+5; b++){
                        const mutation = mutateSvg(decodedString);

                        var link = document.createElement("a");
                        row.appendChild(link);
                        link.href = `?b64string=${btoa(mutation)}`;

                        var canvas = document.createElement("span");
                        canvas.classList.add("canvas");
                        canvas.innerHTML = dataToSvgContent(mutation);
                        link.appendChild(canvas)
                    }
                    document.getElementById("mutations").appendChild(row);
                }
            }
            function newBase(){
                decodedString = `${Math.floor(Math.random() * 255)};${randomEllipse()}:${randomEllipse()}:${randomEllipse()}:${randomEllipse()}:${randomEllipse()}`;
                document.getElementById('canvas').innerHTML = dataToSvgContent(decodedString);
                populateMutationOptions();
            }

            let params = new URLSearchParams(document.location.search);
            const b64string = params.get("b64string");
            let decodedString = `${Math.floor(Math.random() * 255)};${randomEllipse()}:${randomEllipse()}:${randomEllipse()}:${randomEllipse()}:${randomEllipse()}`;
            console.log(btoa(decodedString));
            if(b64string){
                decodedString = atob(b64string);
            }


            document.getElementById("canvas").innerHTML = dataToSvgContent(decodedString);
            
            populateMutationOptions();
            

        </script>
    </body>
</html>
